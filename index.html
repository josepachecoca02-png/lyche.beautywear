<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyche Beautywear - Privado</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Supabase JS SDK v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind Theme -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        lyche: {
                            main: '#D8A0A8',
                            hover: '#C88D95',
                            light: '#F3E1E4',
                            soft: '#FAF3F4',
                            white: '#FFFFFF',
                            dark: '#3B3032',
                            sub: '#827477',
                            border: '#EBDDE0',
                            green: '#54836A',
                            red: '#B85C66'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #FAF3F4;
            color: #3B3032;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #FAF3F4; }
        ::-webkit-scrollbar-thumb { background: #D8A0A8; border-radius: 4px; }

        .sidebar-item-active {
            background-color: #F3E1E4;
            color: #3B3032;
            font-weight: 700;
            border-right: 4px solid #D8A0A8;
        }

        .modal-backdrop {
            background-color: rgba(59, 48, 50, 0.6);
            backdrop-filter: blur(4px);
        }

        /* AISLAMIENTO TOTAL PARA IMPRESIÓN POS */
        @media print {
            /* Ocultar todo en el body EXCEPTO el ticket */
            body > *:not(#printable-ticket) {
                display: none !important;
            }
            
            /* Formato exclusivo para la tirilla */
            #printable-ticket {
                display: block !important;
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 80mm !important; /* Ancho estándar de impresora térmica */
                margin: 0 !important;
                padding: 10px !important;
                background: white !important;
                color: black !important;
                font-family: 'Courier New', Courier, monospace !important;
                font-size: 11px !important;
                line-height: 1.3 !important;
            }
            
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden relative">

    <!-- PANTALLA DE BLOQUEO (BÓVEDA SUPABASE) -->
    <div id="auth-screen" class="fixed inset-0 z-[100] bg-lyche-soft flex items-center justify-center transition-opacity duration-300">
        <div class="bg-white p-8 rounded-2xl shadow-xl border border-lyche-border w-full max-w-sm">
            <div class="text-center mb-6">
                <div class="w-16 h-16 rounded-2xl bg-lyche-light flex items-center justify-center text-lyche-main shadow-sm border border-lyche-border mx-auto mb-3">
                    <i class="fa-solid fa-crown text-3xl"></i>
                </div>
                <h1 class="text-xl font-bold text-lyche-dark tracking-wide uppercase">Lyche Beautywear</h1>
                <p class="text-xs text-lyche-sub font-medium mt-1">Acceso Privado</p>
            </div>
            <form onsubmit="handleLoginSubmit(event)" class="space-y-4 text-sm">
                <div>
                    <label class="block font-bold text-lyche-dark mb-1 text-xs">Correo Electrónico</label>
                    <input type="email" id="login-email" required class="w-full p-2.5 border border-lyche-border rounded-xl bg-lyche-soft focus:outline-none focus:border-lyche-main transition text-xs">
                </div>
                <div>
                    <label class="block font-bold text-lyche-dark mb-1 text-xs">Contraseña</label>
                    <input type="password" id="login-pass" required class="w-full p-2.5 border border-lyche-border rounded-xl bg-lyche-soft focus:outline-none focus:border-lyche-main transition text-xs">
                </div>
                <button type="submit" id="btn-login" class="w-full bg-lyche-main hover:bg-lyche-hover text-white py-3 rounded-xl font-bold transition shadow-md text-xs mt-2 flex items-center justify-center">
                    <span>Iniciar Sesión Segura</span>
                </button>
                <div id="auth-error" class="text-lyche-red text-[10px] text-center font-bold hidden"></div>
            </form>
        </div>
    </div>

    <!-- TICKET DE IMPRESIÓN POS (Fuera del contenedor principal para evitar conflictos Flex/Grid al imprimir) -->
    <div id="printable-ticket" class="hidden">
        <!-- Contenido inyectado por JS -->
    </div>

    <!-- CONTENEDOR PRINCIPAL DEL SISTEMA (Oculto por defecto) -->
    <div id="app-wrapper" class="hidden h-full w-full flex overflow-hidden">
        
        <!-- SIDEBAR (Desktop) -->
        <aside id="sidebar" class="w-64 bg-white border-r border-lyche-border flex-col justify-between hidden md:flex transition-all duration-300 z-20">
            <div class="flex flex-col h-full">
                <!-- Brand Header -->
                <div class="p-5 border-b border-lyche-border flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-lyche-light flex items-center justify-center text-lyche-main border border-lyche-border">
                        <i class="fa-solid fa-crown text-lg"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-sm tracking-wide text-lyche-dark uppercase leading-tight">Lyche Admin</h1>
                        <p class="text-[10px] text-emerald-600 font-bold"><i class="fa-solid fa-lock mr-1"></i>Conectado</p>
                    </div>
                </div>

                <!-- Navigation -->
                <nav class="flex-1 overflow-y-auto py-3 space-y-1 px-2 text-xs font-semibold">
                    <a href="#" onclick="switchTab('dashboard'); return false;" id="nav-dashboard" class="sidebar-item flex items-center px-3 py-2.5 rounded-xl text-lyche-dark sidebar-item-active">
                        <i class="fa-solid fa-chart-line w-6 text-lyche-main text-sm"></i><span>Dashboard</span>
                    </a>
                    <a href="#" onclick="switchTab('inventory'); return false;" id="nav-inventory" class="sidebar-item flex items-center px-3 py-2.5 rounded-xl text-lyche-sub hover:bg-lyche-soft hover:text-lyche-dark">
                        <i class="fa-solid fa-shirt w-6 text-lyche-main text-sm"></i><span>Inventario</span>
                    </a>
                    <a href="#" onclick="switchTab('pos'); return false;" id="nav-pos" class="sidebar-item flex items-center px-3 py-2.5 rounded-xl text-lyche-sub hover:bg-lyche-soft hover:text-lyche-dark">
                        <i class="fa-solid fa-cash-register w-6 text-lyche-main text-sm"></i><span>Ventas POS</span>
                    </a>
                    <a href="#" onclick="switchTab('customers'); return false;" id="nav-customers" class="sidebar-item flex items-center px-3 py-2.5 rounded-xl text-lyche-sub hover:bg-lyche-soft hover:text-lyche-dark">
                        <i class="fa-solid fa-users w-6 text-lyche-main text-sm"></i><span>Clientes & CXC</span>
                    </a>
                    <a href="#" onclick="switchTab('suppliers'); return false;" id="nav-suppliers" class="sidebar-item flex items-center px-3 py-2.5 rounded-xl text-lyche-sub hover:bg-lyche-soft hover:text-lyche-dark">
                        <i class="fa-solid fa-truck-field w-6 text-lyche-main text-sm"></i><span>Proveedores & CXP</span>
                    </a>
                    <a href="#" onclick="switchTab('expenses'); return false;" id="nav-expenses" class="sidebar-item flex items-center px-3 py-2.5 rounded-xl text-lyche-sub hover:bg-lyche-soft hover:text-lyche-dark">
                        <i class="fa-solid fa-receipt w-6 text-lyche-main text-sm"></i><span>Gastos</span>
                    </a>
                    <a href="#" onclick="switchTab('accounts'); return false;" id="nav-accounts" class="sidebar-item flex items-center px-3 py-2.5 rounded-xl text-lyche-sub hover:bg-lyche-soft hover:text-lyche-dark">
                        <i class="fa-solid fa-building-columns w-6 text-lyche-main text-sm"></i><span>Caja & Bancos</span>
                    </a>
                    <a href="#" onclick="switchTab('ledger'); return false;" id="nav-ledger" class="sidebar-item flex items-center px-3 py-2.5 rounded-xl text-lyche-sub hover:bg-lyche-soft hover:text-lyche-dark">
                        <i class="fa-solid fa-arrow-trend-up w-6 text-lyche-main text-sm"></i><span>Flujo de Caja</span>
                    </a>
                </nav>

                <!-- Footer Logout -->
                <div class="p-4 border-t border-lyche-border bg-lyche-soft">
                    <button onclick="handleSignOut()" class="w-full bg-white border border-lyche-border hover:bg-lyche-light text-lyche-dark py-2 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Cerrar Sesión</span>
                    </button>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <div class="flex-1 flex flex-col h-full overflow-hidden relative">
            <header class="bg-white border-b border-lyche-border px-4 py-3 flex items-center justify-between z-10 shadow-sm">
                <div class="flex items-center space-x-3">
                    <button onclick="toggleMobileMenu()" class="md:hidden text-lyche-dark p-2 hover:bg-lyche-soft rounded-lg">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <span id="current-tab-title" class="text-sm font-bold text-lyche-dark">Dashboard</span>
                </div>
                <div class="flex items-center space-x-3">
                    <span id="current-datetime" class="text-[11px] text-lyche-sub hidden sm:inline-block font-mono"></span>
                    <button onclick="switchTab('pos')" class="bg-lyche-main hover:bg-lyche-hover text-white px-3 py-1.5 rounded-xl text-xs font-bold flex items-center space-x-1.5 shadow-sm transition">
                        <i class="fa-solid fa-bolt"></i><span class="hidden sm:inline">Nueva Venta</span>
                    </button>
                </div>
            </header>

            <main id="main-content" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6">
                <!-- Contenido Dinámico -->
            </main>
        </div>
    </div>

    <!-- MENU MÓVIL OVERLAY -->
    <div id="mobile-menu" class="fixed inset-0 z-40 bg-black/50 hidden md:hidden" onclick="toggleMobileMenu()">
        <div class="w-64 bg-white h-full p-4 flex flex-col justify-between" onclick="event.stopPropagation()">
            <div>
                <div class="flex items-center justify-between border-b border-lyche-border pb-3 mb-3">
                    <span class="font-bold text-sm text-lyche-dark">MENÚ</span>
                    <button onclick="toggleMobileMenu()" class="text-lyche-sub p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <!-- Mismos enlaces que desktop -->
                <nav class="space-y-1 text-xs font-semibold">
                    <a href="#" onclick="switchTab('dashboard'); toggleMobileMenu(); return false;" class="flex items-center px-3 py-2.5 rounded-xl text-lyche-dark"><i class="fa-solid fa-chart-line w-6 text-lyche-main"></i><span>Dashboard</span></a>
                    <a href="#" onclick="switchTab('inventory'); toggleMobileMenu(); return false;" class="flex items-center px-3 py-2.5 rounded-xl text-lyche-dark"><i class="fa-solid fa-shirt w-6 text-lyche-main"></i><span>Inventario</span></a>
                    <a href="#" onclick="switchTab('pos'); toggleMobileMenu(); return false;" class="flex items-center px-3 py-2.5 rounded-xl text-lyche-dark"><i class="fa-solid fa-cash-register w-6 text-lyche-main"></i><span>Ventas POS</span></a>
                    <a href="#" onclick="switchTab('customers'); toggleMobileMenu(); return false;" class="flex items-center px-3 py-2.5 rounded-xl text-lyche-dark"><i class="fa-solid fa-users w-6 text-lyche-main"></i><span>Clientes & CXC</span></a>
                    <a href="#" onclick="switchTab('suppliers'); toggleMobileMenu(); return false;" class="flex items-center px-3 py-2.5 rounded-xl text-lyche-dark"><i class="fa-solid fa-truck-field w-6 text-lyche-main"></i><span>Proveedores & CXP</span></a>
                    <a href="#" onclick="switchTab('expenses'); toggleMobileMenu(); return false;" class="flex items-center px-3 py-2.5 rounded-xl text-lyche-dark"><i class="fa-solid fa-receipt w-6 text-lyche-main"></i><span>Gastos</span></a>
                    <a href="#" onclick="switchTab('accounts'); toggleMobileMenu(); return false;" class="flex items-center px-3 py-2.5 rounded-xl text-lyche-dark"><i class="fa-solid fa-building-columns w-6 text-lyche-main"></i><span>Caja & Bancos</span></a>
                    <a href="#" onclick="switchTab('ledger'); toggleMobileMenu(); return false;" class="flex items-center px-3 py-2.5 rounded-xl text-lyche-dark"><i class="fa-solid fa-arrow-trend-up w-6 text-lyche-main"></i><span>Flujo de Caja</span></a>
                </nav>
            </div>
            <button onclick="handleSignOut()" class="w-full bg-lyche-red text-white py-2 rounded-xl text-xs font-bold mt-4">Cerrar Sesión</button>
        </div>
    </div>

    <!-- GLOBAL MODAL -->
    <div id="modal-container" class="fixed inset-0 z-50 modal-backdrop hidden flex items-center justify-center p-4">
        <div id="modal-content" class="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6 relative border border-lyche-border">
        </div>
    </div>

    <!-- TOASTS -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <script>
        // 1. SUPABASE CONFIGURATION
        const SUPABASE_URL = "https://zpgioiwytypqdfpvngtx.supabase.co";
        const SUPABASE_KEY = "sb_publishable_ppMMkybxiKcbjyqy9jGPVw_lVMeqapB";
        
        let supabaseApp = null;
        try {
            if (window.supabase) {
                supabaseApp = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
        } catch (e) {
            console.error("Supabase init error:", e);
        }

        // 2. CLEAN STATE: BASE DE DATOS LOCAL VACÍA, SOLO CUENTAS FIJAS
        const INITIAL_CLEAN_DATA = {
            products: [],
            customers: [],
            suppliers: [],
            accounts: [
                { id: 'ACC-CAJA', name: 'Caja Física (Efectivo)', type: 'EFECTIVO', balance: 0 },
                { id: 'ACC-BANCO', name: 'Bancolombia', type: 'BANCO', balance: 0 },
                { id: 'ACC-NEQUI', name: 'Nequi', type: 'DIGITAL', balance: 0 }
            ],
            sales: [],
            expenses: [],
            ledger: []
        };

        class Store {
            constructor() {
                this.load();
            }
            load() {
                const stored = localStorage.getItem('lyche_private_db');
                if (stored) {
                    try {
                        this.data = JSON.parse(stored);
                        // Asegurar integridad estructural si se borra algo accidentalmente
                        if (!this.data.products) this.data.products = [];
                        if (!this.data.customers) this.data.customers = [];
                        if (!this.data.suppliers) this.data.suppliers = [];
                        if (!this.data.sales) this.data.sales = [];
                        if (!this.data.expenses) this.data.expenses = [];
                        if (!this.data.ledger) this.data.ledger = [];
                        if (!this.data.accounts || this.data.accounts.length === 0) {
                            this.data.accounts = JSON.parse(JSON.stringify(INITIAL_CLEAN_DATA.accounts));
                        }
                    } catch (e) {
                        this.data = JSON.parse(JSON.stringify(INITIAL_CLEAN_DATA));
                        this.save();
                    }
                } else {
                    this.data = JSON.parse(JSON.stringify(INITIAL_CLEAN_DATA));
                    this.save();
                }
            }
            save() {
                localStorage.setItem('lyche_private_db', JSON.stringify(this.data));
            }
        }

        const DB = new Store();
        let currentTab = 'dashboard';
        let chartInstances = {};
        let posCart = [];

        // 3. EVENTOS DE IMPRESIÓN SEGUROS
        // Asegura que al cerrar la ventana de impresión, el ticket vuelva a ocultarse
        window.addEventListener('afterprint', () => {
            const ticket = document.getElementById('printable-ticket');
            if(ticket) ticket.classList.add('hidden');
        });

        // 4. FUNCIONES GLOBALES
        window.toggleMobileMenu = () => {
            const menu = document.getElementById('mobile-menu');
            if (menu) menu.classList.toggle('hidden');
        };

        window.closeModal = () => {
            const container = document.getElementById('modal-container');
            if (container) container.classList.add('hidden');
        };

        window.formatCOP = (amount) => {
            return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', minimumFractionDigits: 0 }).format(amount || 0) + ' COP';
        };

        window.formatDate = (isoStr) => {
            if (!isoStr) return 'N/A';
            return new Date(isoStr).toLocaleDateString('es-CO', {
                timeZone: 'America/Bogota', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });
        };

        window.showToast = (message, type = 'info') => {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-700' : type === 'error' ? 'bg-lyche-red' : 'bg-lyche-dark';
            toast.className = `${bgClass} text-white px-4 py-3 rounded-2xl shadow-lg flex items-center space-x-3 pointer-events-auto transition-all duration-300 transform translate-y-2 opacity-0 text-xs font-semibold`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-check' : 'fa-info-circle'}"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        window.openModal = (title, bodyHtml) => {
            const container = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            if (!container || !content) return;
            content.innerHTML = `
                <div class="flex items-center justify-between pb-3 mb-4 border-b border-lyche-border">
                    <h3 class="text-base font-bold text-lyche-dark">${title}</h3>
                    <button onclick="closeModal()" class="text-lyche-sub hover:text-lyche-dark p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <div>${bodyHtml}</div>
            `;
            container.classList.remove('hidden');
        };

        window.recordLedgerMovement = (type, concept, accountId, amount, reference = '') => {
            const acc = DB.data.accounts.find(a => a.id === accountId);
            DB.data.ledger.unshift({
                id: 'MOV-' + Date.now(),
                date: new Date().toISOString(),
                type, concept, accountId,
                accountName: acc ? acc.name : 'N/A',
                amount,
                runningBalance: acc ? acc.balance : 0,
                reference
            });
            DB.save();
        };

        window.switchTab = (tabId) => {
            currentTab = tabId;
            document.querySelectorAll('.sidebar-item').forEach(item => {
                item.classList.remove('sidebar-item-active', 'text-lyche-dark');
                item.classList.add('text-lyche-sub');
            });
            const activeNav = document.getElementById(`nav-${tabId}`);
            if (activeNav) {
                activeNav.classList.add('sidebar-item-active', 'text-lyche-dark');
                activeNav.classList.remove('text-lyche-sub');
            }
            
            const titles = {
                dashboard: 'Dashboard / Inicio', inventory: 'Inventario de Prendas', pos: 'Punto de Venta POS',
                customers: 'Clientes & Cartera', suppliers: 'Proveedores', expenses: 'Gastos Operativos',
                accounts: 'Caja & Bancos', ledger: 'Flujo de Caja'
            };
            const titleEl = document.getElementById('current-tab-title');
            if (titleEl) titleEl.innerText = titles[tabId] || 'Lyche Beautywear';
            
            renderCurrentTab();
        };

        function renderCurrentTab() {
            const main = document.getElementById('main-content');
            if (!main) return;
            
            Object.keys(chartInstances).forEach(key => {
                if (chartInstances[key]) {
                    try { chartInstances[key].destroy(); } catch(e){}
                    delete chartInstances[key];
                }
            });

            switch (currentTab) {
                case 'dashboard': renderDashboard(main); break;
                case 'inventory': renderInventory(main); break;
                case 'pos': renderPOS(main); break;
                case 'customers': renderCustomers(main); break;
                case 'suppliers': renderSuppliers(main); break;
                case 'expenses': renderExpenses(main); break;
                case 'accounts': renderAccounts(main); break;
                case 'ledger': renderLedger(main); break;
            }
        }

        // ========================== MÓDULOS ==========================

        function renderDashboard(container) {
            const salesMonth = DB.data.sales.reduce((sum, s) => sum + s.total, 0);
            const totalExpenses = DB.data.expenses.reduce((sum, e) => sum + e.amount, 0);
            
            const cajaBalance = DB.data.accounts.find(a => a.id === 'ACC-CAJA')?.balance || 0;
            const bancoBalance = DB.data.accounts.find(a => a.id === 'ACC-BANCO')?.balance || 0;
            const nequiBalance = DB.data.accounts.find(a => a.id === 'ACC-NEQUI')?.balance || 0;
            const totalMoney = cajaBalance + bancoBalance + nequiBalance;

            let invCost = 0, lowStock = 0;
            DB.data.products.forEach(p => p.variants.forEach(v => {
                invCost += (v.stock * p.cost);
                if (v.stock <= 2) lowStock++;
            }));

            container.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div class="bg-white p-4 rounded-2xl border border-lyche-border flex items-center justify-between">
                        <div><p class="text-[10px] font-bold text-lyche-sub uppercase">Total Ventas (Histórico)</p><h3 class="text-lg font-bold text-lyche-dark">${formatCOP(salesMonth)}</h3></div>
                    </div>
                    <div class="bg-white p-4 rounded-2xl border border-lyche-border flex items-center justify-between">
                        <div><p class="text-[10px] font-bold text-lyche-sub uppercase">Total Gastos (Histórico)</p><h3 class="text-lg font-bold text-lyche-red">${formatCOP(totalExpenses)}</h3></div>
                    </div>
                    <div class="bg-white p-4 rounded-2xl border border-lyche-border flex items-center justify-between">
                        <div><p class="text-[10px] font-bold text-lyche-sub uppercase">Dinero en Cuentas</p><h3 class="text-lg font-bold text-emerald-700">${formatCOP(totalMoney)}</h3></div>
                    </div>
                    <div class="bg-white p-4 rounded-2xl border border-lyche-border flex items-center justify-between">
                        <div><p class="text-[10px] font-bold text-lyche-sub uppercase">Costo Inventario</p><h3 class="text-lg font-bold text-lyche-dark">${formatCOP(invCost)}</h3></div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
                    <div class="bg-white p-4 rounded-xl border border-lyche-border">
                        <p class="text-[11px] font-bold text-lyche-sub">Caja Física (Efectivo)</p>
                        <p class="text-base font-extrabold text-lyche-dark mt-1">${formatCOP(cajaBalance)}</p>
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-lyche-border">
                        <p class="text-[11px] font-bold text-lyche-sub">Bancolombia</p>
                        <p class="text-base font-extrabold text-lyche-dark mt-1">${formatCOP(bancoBalance)}</p>
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-lyche-border">
                        <p class="text-[11px] font-bold text-lyche-sub">Nequi</p>
                        <p class="text-base font-extrabold text-lyche-dark mt-1">${formatCOP(nequiBalance)}</p>
                    </div>
                </div>
            `;
        }

        // ================= INVENTARIO =================
        function renderInventory(container) {
            container.innerHTML = `
                <div class="flex justify-between bg-white p-4 rounded-2xl border border-lyche-border">
                    <h3 class="font-bold text-sm">Prendas & Variantes</h3>
                    <button onclick="openNewProductModal()" class="bg-lyche-main text-white px-4 py-2 rounded-xl text-xs font-bold shadow-sm">+ Nueva Prenda</button>
                </div>
                <div class="bg-white rounded-2xl border border-lyche-border overflow-hidden">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-lyche-soft border-b border-lyche-border text-lyche-sub">
                            <tr><th class="p-3">Ref</th><th class="p-3">Prenda</th><th class="p-3">Costo</th><th class="p-3">Precio</th><th class="p-3">Variantes (Stock)</th><th class="p-3 text-right">Acción</th></tr>
                        </thead>
                        <tbody class="divide-y divide-lyche-border">
                            ${DB.data.products.length === 0 ? '<tr><td colspan="6" class="p-8 text-center text-lyche-sub">No hay prendas. Haz clic en + Nueva Prenda.</td></tr>' : ''}
                            ${DB.data.products.map(p => `
                                <tr>
                                    <td class="p-3 font-mono font-bold text-lyche-main">${p.ref}</td>
                                    <td class="p-3 font-bold">${p.name}</td>
                                    <td class="p-3">${formatCOP(p.cost)}</td>
                                    <td class="p-3 font-bold">${formatCOP(p.price)}</td>
                                    <td class="p-3">
                                        <div class="flex gap-1 flex-wrap">${p.variants.map(v => `<span class="px-1.5 py-0.5 border rounded text-[10px]"><b>${v.size}</b>-${v.color}: ${v.stock}</span>`).join('')}</div>
                                    </td>
                                    <td class="p-3 text-right"><button onclick="deleteProduct('${p.id}')" class="text-lyche-red p-1"><i class="fa-solid fa-trash"></i></button></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        window.openNewProductModal = () => {
            openModal("Registrar Nueva Prenda", `
                <form onsubmit="saveProduct(event)" class="space-y-3 text-xs">
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="block font-bold mb-1">Referencia / SKU *</label><input type="text" id="p-ref" required class="w-full p-2 border rounded-xl bg-lyche-soft"></div>
                        <div><label class="block font-bold mb-1">Nombre de Prenda *</label><input type="text" id="p-name" required class="w-full p-2 border rounded-xl bg-lyche-soft"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="block font-bold mb-1">Costo Base (COP) *</label><input type="number" id="p-cost" required class="w-full p-2 border rounded-xl bg-lyche-soft"></div>
                        <div><label class="block font-bold mb-1">Precio Venta (COP) *</label><input type="number" id="p-price" required class="w-full p-2 border rounded-xl bg-lyche-soft"></div>
                    </div>
                    <div class="border-t pt-3">
                        <label class="block font-bold mb-2">Variantes</label>
                        <div id="variant-rows" class="space-y-2">
                            <div class="flex space-x-2"><input type="text" placeholder="Talla" class="v-size w-1/3 p-2 border rounded" required><input type="text" placeholder="Color" class="v-color w-1/3 p-2 border rounded" required><input type="number" placeholder="Stock Inicial" class="v-stock w-1/3 p-2 border rounded" required min="0"></div>
                        </div>
                        <button type="button" onclick="addVariantInputRow()" class="mt-2 text-lyche-main font-bold">+ Agregar variante</button>
                    </div>
                    <div class="flex justify-end space-x-2 pt-3"><button type="submit" class="px-4 py-2 bg-lyche-main text-white font-bold rounded-xl">Guardar Prenda</button></div>
                </form>
            `);
        };

        window.addVariantInputRow = () => {
            const div = document.createElement('div');
            div.className = 'flex space-x-2';
            div.innerHTML = `<input type="text" placeholder="Talla" class="v-size w-1/3 p-2 border rounded" required><input type="text" placeholder="Color" class="v-color w-1/3 p-2 border rounded" required><input type="number" placeholder="Stock Inicial" class="v-stock w-1/3 p-2 border rounded" required min="0">`;
            document.getElementById('variant-rows').appendChild(div);
        };

        window.saveProduct = (e) => {
            e.preventDefault();
            const ref = document.getElementById('p-ref').value, name = document.getElementById('p-name').value;
            const cost = parseFloat(document.getElementById('p-cost').value), price = parseFloat(document.getElementById('p-price').value);
            const sizes = document.querySelectorAll('.v-size'), colors = document.querySelectorAll('.v-color'), stocks = document.querySelectorAll('.v-stock');
            
            const variants = [];
            sizes.forEach((s, i) => variants.push({ id: 'VAR-'+Date.now()+i, size: s.value, color: colors[i].value, stock: parseInt(stocks[i].value), cost, price }));

            DB.data.products.push({ id: 'PROD-'+Date.now(), ref, name, category: 'General', cost, price, variants });
            DB.save(); closeModal(); showToast("Prenda guardada", "success"); renderInventory(document.getElementById('main-content'));
        };

        window.deleteProduct = (id) => {
            if(confirm("¿Eliminar prenda?")) { DB.data.products = DB.data.products.filter(p => p.id !== id); DB.save(); renderInventory(document.getElementById('main-content')); }
        };

        // ================= POS Y TICKETS =================
        function renderPOS(container) {
            container.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 h-full">
                    <div class="lg:col-span-2 bg-white p-4 rounded-2xl border border-lyche-border">
                        <h3 class="font-bold text-sm mb-3">Catálogo para Vender</h3>
                        <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                            ${DB.data.products.length === 0 ? '<p class="text-xs text-lyche-sub">No hay prendas. Registra en Inventario primero.</p>' : ''}
                            ${DB.data.products.map(p => `
                                <div class="border rounded-xl p-3">
                                    <p class="font-mono text-[10px] text-lyche-main">${p.ref}</p>
                                    <p class="font-bold text-xs line-clamp-1">${p.name}</p>
                                    <p class="font-bold text-xs mt-1">${formatCOP(p.price)}</p>
                                    <div class="mt-2 flex flex-wrap gap-1">
                                        ${p.variants.map(v => `<button onclick="addVariantToPOSCart('${p.id}', '${v.id}')" ${v.stock<=0?'disabled':''} class="px-1.5 py-1 text-[9px] border rounded ${v.stock<=0?'bg-gray-100 text-gray-400':'bg-lyche-soft font-bold'}">${v.size}-${v.color} (${v.stock})</button>`).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="bg-white p-4 rounded-2xl border border-lyche-border flex flex-col justify-between">
                        <div>
                            <h3 class="font-bold text-sm border-b pb-2 mb-2">Carrito POS</h3>
                            <select id="pos-customer" class="w-full p-2 border rounded-xl bg-lyche-soft text-xs mb-2">
                                <option value="">Cliente Contado</option>
                                ${DB.data.customers.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
                            </select>
                            <div id="pos-cart-list" class="space-y-2 max-h-48 overflow-y-auto text-xs"><p class="text-lyche-sub py-4 text-center">Vacío</p></div>
                        </div>
                        <div class="border-t pt-3 space-y-2 text-xs">
                            <div class="flex justify-between"><span>Subtotal:</span><span id="pos-subtotal" class="font-bold">$0</span></div>
                            <div class="flex justify-between items-center"><span>Descuento:</span><input type="number" id="pos-discount" oninput="updatePOSTotals()" value="0" class="w-20 p-1 border rounded text-right"></div>
                            <div class="flex justify-between text-base font-bold text-lyche-main pt-2"><span>TOTAL:</span><span id="pos-total">$0</span></div>
                            <label class="block font-bold text-[10px] mt-2">Cuenta Recaudo / Método</label>
                            <select id="pos-method" class="w-full p-2 border rounded-xl bg-lyche-soft">
                                <option value="ACC-CAJA">Caja Física (Efectivo)</option><option value="ACC-BANCO">Bancolombia</option><option value="ACC-NEQUI">Nequi</option><option value="CREDITO">Venta a Crédito (Fiado)</option>
                            </select>
                            <button onclick="confirmSaleProcess()" class="w-full bg-lyche-main text-white py-3 rounded-xl font-bold mt-2 shadow flex justify-center space-x-2"><i class="fa-solid fa-print"></i><span>Procesar e Imprimir</span></button>
                        </div>
                    </div>
                </div>
            `;
            renderPOSCartList();
        }

        window.addVariantToPOSCart = (prodId, varId) => {
            const p = DB.data.products.find(x => x.id === prodId), v = p.variants.find(x => x.id === varId);
            if(v.stock <= 0) return;
            const ex = posCart.find(i => i.variantId === varId);
            if(ex) { if(ex.qty + 1 > v.stock) return showToast("Stock máximo", "error"); ex.qty++; ex.total = ex.qty * ex.unitPrice; }
            else posCart.push({ productId: p.id, variantId: v.id, name: `${p.name} (${v.size}-${v.color})`, qty: 1, unitPrice: p.price, total: p.price });
            renderPOSCartList();
        };

        function renderPOSCartList() {
            const list = document.getElementById('pos-cart-list');
            if(!list) return;
            if(posCart.length === 0) { list.innerHTML = '<p class="text-lyche-sub py-4 text-center">Vacío</p>'; }
            else {
                list.innerHTML = posCart.map((i, idx) => `
                    <div class="flex justify-between py-1 border-b">
                        <div class="truncate pr-2"><p class="font-bold truncate">${i.name}</p><p class="text-[9px] text-lyche-sub">${formatCOP(i.unitPrice)} x ${i.qty}</p></div>
                        <div class="flex items-center space-x-2"><span class="font-bold">${formatCOP(i.total)}</span><button onclick="posCart.splice(${idx},1); renderPOSCartList();" class="text-lyche-red"><i class="fa-solid fa-trash"></i></button></div>
                    </div>
                `).join('');
            }
            updatePOSTotals();
        }

        window.updatePOSTotals = () => {
            const sub = posCart.reduce((s, i) => s + i.total, 0), desc = parseFloat(document.getElementById('pos-discount')?.value) || 0;
            const tot = Math.max(0, sub - desc);
            const sEl = document.getElementById('pos-subtotal'), tEl = document.getElementById('pos-total');
            if(sEl) sEl.innerText = formatCOP(sub);
            if(tEl) tEl.innerText = formatCOP(tot);
        };

        window.confirmSaleProcess = () => {
            if (posCart.length === 0) return showToast("Carrito vacío", "error");
            const custId = document.getElementById('pos-customer').value, method = document.getElementById('pos-method').value;
            const desc = parseFloat(document.getElementById('pos-discount').value) || 0;
            const sub = posCart.reduce((s, i) => s + i.total, 0), tot = Math.max(0, sub - desc);
            const isCredit = method === 'CREDITO';
            if (isCredit && !custId) return showToast("Selecciona cliente para crédito", "error");

            const consec = 'INV-' + String(1000 + DB.data.sales.length + 1).padStart(4, '0');
            const sale = { id: 'VEN-'+Date.now(), consecutive: consec, date: new Date().toISOString(), customerId: custId, items: JSON.parse(JSON.stringify(posCart)), total: tot, method, isCredit };

            // Descontar inventario
            posCart.forEach(i => { const v = DB.data.products.find(p=>p.id===i.productId)?.variants.find(v=>v.id===i.variantId); if(v) v.stock -= i.qty; });

            // Flujo Financiero
            if(isCredit) {
                const c = DB.data.customers.find(x=>x.id===custId); if(c) c.balance = (c.balance||0) + tot;
            } else {
                const acc = DB.data.accounts.find(a=>a.id===method);
                if(acc) { acc.balance += tot; recordLedgerMovement('INGRESO', `Venta POS ${consec}`, acc.id, tot, consec); }
            }

            DB.data.sales.push(sale); DB.save();
            posCart = [];
            printThermalTicket(sale); // Inyecta y llama window.print()
            renderPOS(document.getElementById('main-content'));
        };

        function printThermalTicket(sale) {
            const t = document.getElementById('printable-ticket');
            const cName = DB.data.customers.find(c=>c.id===sale.customerId)?.name || 'Contado';
            const mName = sale.isCredit ? 'Crédito' : DB.data.accounts.find(a=>a.id===sale.method)?.name || 'Caja';
            
            t.innerHTML = `
                <div style="text-align: center; border-bottom: 1px dashed #000; padding-bottom: 5px; margin-bottom: 5px;">
                    <h2 style="font-size: 14px; font-weight: bold; margin: 0;">LYCHE BEAUTYWEAR</h2>
                    <p style="margin: 0; font-size: 10px;">Boutique & Fashion</p>
                </div>
                <div style="margin-bottom: 5px; font-size: 10px;">
                    <p style="margin: 0;"><strong>Ticket:</strong> ${sale.consecutive}</p>
                    <p style="margin: 0;"><strong>Fecha:</strong> ${formatDate(sale.date)}</p>
                    <p style="margin: 0;"><strong>Cliente:</strong> ${cName}</p>
                </div>
                <table style="width: 100%; font-size: 10px; border-collapse: collapse; margin-bottom: 5px;">
                    <tr style="border-top:1px dashed #000; border-bottom:1px dashed #000;"><th align="left">Cant. Prenda</th><th align="right">Total</th></tr>
                    ${sale.items.map(i => `<tr><td align="left">${i.qty} x ${i.name}</td><td align="right">${formatCOP(i.total)}</td></tr>`).join('')}
                </table>
                <div style="text-align: right; font-size: 10px; border-bottom: 1px dashed #000; padding-bottom: 5px;">
                    <p style="margin: 0; font-size: 12px; font-weight: bold;">TOTAL: ${formatCOP(sale.total)}</p>
                    <p style="margin: 0;">Pago: ${mName}</p>
                </div>
                <p style="text-align: center; font-size: 10px; margin-top: 5px;">¡Gracias por tu compra!<br>@lychebeautywear</p>
            `;
            t.classList.remove('hidden');
            setTimeout(() => { window.print(); }, 200);
        }

        // ================= CUENTAS Y AJUSTES =================
        function renderAccounts(container) {
            container.innerHTML = `
                <div class="flex justify-between bg-white p-4 rounded-2xl border border-lyche-border">
                    <h3 class="font-bold text-sm">Caja & Bancos (Fijas)</h3>
                    <p class="text-xs text-lyche-sub">Ajusta el saldo inicial aquí.</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    ${DB.data.accounts.map(a => `
                        <div class="bg-white p-4 rounded-xl border border-lyche-border text-center">
                            <h4 class="font-bold text-lyche-sub uppercase text-xs">${a.name}</h4>
                            <p class="text-xl font-extrabold text-lyche-dark my-2">${formatCOP(a.balance)}</p>
                            <button onclick="openAdjustModal('${a.id}')" class="text-[10px] font-bold bg-lyche-soft px-3 py-1.5 rounded-lg border">Ajustar Saldo</button>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        window.openAdjustModal = (id) => {
            const acc = DB.data.accounts.find(a=>a.id===id);
            openModal(`Ajustar Saldo - ${acc.name}`, `
                <form onsubmit="saveAdjustment(event, '${id}')" class="space-y-3 text-xs">
                    <div><label class="font-bold">Nuevo Saldo Real</label><input type="number" id="adj-amt" value="${acc.balance}" required class="w-full p-2 border rounded bg-lyche-soft"></div>
                    <div><label class="font-bold">Motivo (Ej. Saldo Inicial)</label><input type="text" id="adj-reason" required class="w-full p-2 border rounded bg-lyche-soft"></div>
                    <button type="submit" class="w-full bg-lyche-main text-white py-2 font-bold rounded">Guardar</button>
                </form>
            `);
        };

        window.saveAdjustment = (e, id) => {
            e.preventDefault(); const amt = parseFloat(document.getElementById('adj-amt').value), reason = document.getElementById('adj-reason').value;
            const acc = DB.data.accounts.find(a=>a.id===id); const diff = amt - acc.balance;
            acc.balance = amt; recordLedgerMovement(diff>=0?'INGRESO':'EGRESO', `Ajuste: ${reason}`, acc.id, Math.abs(diff), 'AJUSTE');
            DB.save(); closeModal(); renderAccounts(document.getElementById('main-content'));
        };

        function renderLedger(container) {
            container.innerHTML = `
                <div class="bg-white p-4 rounded-2xl border border-lyche-border">
                    <h3 class="font-bold text-sm mb-3">Flujo de Caja Auditado</h3>
                    <table class="w-full text-left text-xs">
                        <thead class="bg-lyche-soft border-b border-lyche-border"><tr><th class="p-2">Fecha</th><th class="p-2">Concepto</th><th class="p-2">Cuenta</th><th class="p-2 text-right">Monto</th></tr></thead>
                        <tbody>
                            ${DB.data.ledger.length===0?'<tr><td colspan="4" class="p-4 text-center">Sin movimientos</td></tr>':''}
                            ${DB.data.ledger.map(m=>`<tr><td class="p-2 border-b text-[10px]">${formatDate(m.date)}</td><td class="p-2 border-b font-bold">${m.concept}</td><td class="p-2 border-b text-[10px]">${m.accountName}</td><td class="p-2 border-b text-right font-bold ${m.type==='INGRESO'?'text-emerald-600':'text-lyche-red'}">${m.type==='INGRESO'?'+':'-'}${formatCOP(m.amount)}</td></tr>`).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // ================= AUTHENTICATION (BÓVEDA) =================
        async function checkAuthStatus() {
            if (!supabaseApp) {
                document.getElementById('auth-error').innerText = "Error: Configuración de Supabase ausente.";
                document.getElementById('auth-error').classList.remove('hidden');
                return;
            }
            const { data: { session } } = await supabaseApp.auth.getSession();
            if (session) {
                // Permitir acceso y mostrar UI
                document.getElementById('auth-screen').classList.add('opacity-0');
                setTimeout(() => {
                    document.getElementById('auth-screen').classList.add('hidden');
                    document.getElementById('app-wrapper').classList.remove('hidden');
                    renderCurrentTab();
                }, 300);
            } else {
                // Bloquear UI
                document.getElementById('app-wrapper').classList.add('hidden');
                document.getElementById('auth-screen').classList.remove('hidden', 'opacity-0');
            }
        }

        window.handleLoginSubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value, pass = document.getElementById('login-pass').value;
            const btn = document.getElementById('btn-login'); const err = document.getElementById('auth-error');
            
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>'; err.classList.add('hidden');
            
            if (supabaseApp) {
                const { error } = await supabaseApp.auth.signInWithPassword({ email, password: pass });
                if (error) { err.innerText = "Error: Credenciales inválidas"; err.classList.remove('hidden'); btn.innerHTML = 'Iniciar Sesión Segura'; } 
                else checkAuthStatus();
            }
        };

        window.handleSignOut = async () => {
            if (supabaseApp) { await supabaseApp.auth.signOut(); checkAuthStatus(); }
        };

        // Reloj y Boot
        window.onload = () => {
            setInterval(() => {
                const el = document.getElementById('current-datetime');
                if (el) el.innerText = new Date().toLocaleDateString('es-CO', { timeZone: 'America/Bogota', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            }, 1000);
            checkAuthStatus();
        };

    </script>
</body>
</html>
